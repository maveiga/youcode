  <text x="540" y="800" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="96" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-2">You<tspan fill="#3b73f0">code</tspan></text>

